<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deye Monitor</title>
  <link rel="stylesheet" href="/static/uPlot.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="dashboard-shell">
    <header class="dashboard-header">
      <h1>Deye Monitor</h1>
      <p id="connection">Conectando…</p>
      <p id="age">Sin datos</p>
    </header>
    <div class="dashboard-flow">
      <svg id="dashboard-flow-arrows" class="flow-arrows" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-labelledby="flow-arrows-title flow-arrows-description">
        <title id="flow-arrows-title">Sentido del flujo energético</title>
        <desc id="flow-arrows-description">Flechas entre Paneles, Grid, Batería y UPS/Casa. El sentido se actualiza según la potencia medida.</desc>
        <defs>
          <marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z"></path>
          </marker>
        </defs>
        <path id="flow-pv" class="flow-line idle" d="M 46 24 H 48 V 47 H 49"></path>
        <path id="flow-grid" class="flow-line idle" d="M 54 24 H 52 V 47 H 51"></path>
        <path id="flow-battery" class="flow-line idle" d="M 46 76 H 48 V 53 H 49"></path>
        <path id="flow-load" class="flow-line idle" d="M 54 76 H 52 V 53 H 51"></path>
      </svg>
      <section class="metric-grid" aria-label="Estado energético actual">
      <article class="metric-card metric-card--solar" data-metric="solar">
        <h2>Paneles</h2><p class="metric-status" id="solar-status">Esperando datos</p>
        <div class="metric-gauge" data-gauge="solar" role="img" aria-label="Paneles: Sin dato">
          <svg class="metric-gauge__svg" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
            <path class="metric-gauge__track" d="M 27.47 92.53 A 46 46 0 1 1 92.53 92.53" pathLength="100"></path>
            <path class="metric-gauge__progress" d="M 27.47 92.53 A 46 46 0 1 1 92.53 92.53" pathLength="100"></path>
          </svg>
          <p class="metric-value"><span id="solar-value">Sin dato</span> <span class="metric-unit">W</span><span id="solar-current" class="metric-current">Sin dato</span></p>
        </div>
      </article>
      <article class="metric-card metric-card--grid" data-metric="grid">
        <h2>Grid</h2><p class="metric-status" id="grid-status">Esperando datos</p>
        <div class="metric-gauge" data-gauge="grid" role="img" aria-label="Grid: Sin dato">
          <svg class="metric-gauge__svg" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
            <path class="metric-gauge__track" d="M 27.47 92.53 A 46 46 0 1 1 92.53 92.53" pathLength="100"></path>
            <path class="metric-gauge__progress" d="M 27.47 92.53 A 46 46 0 1 1 92.53 92.53" pathLength="100"></path>
          </svg>
          <p class="metric-value"><span id="grid-value">Sin dato</span> <span class="metric-unit">W</span><span id="grid-current" class="metric-current">Sin dato</span></p>
        </div>
      </article>
      <article class="metric-card metric-card--battery" data-metric="battery">
        <h2>Batería</h2><p class="metric-status" id="battery-status">Esperando datos</p>
        <div class="metric-gauge" data-gauge="battery" role="img" aria-label="Batería: Sin dato">
          <svg class="metric-gauge__svg" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
            <path class="metric-gauge__track" d="M 27.47 92.53 A 46 46 0 1 1 92.53 92.53" pathLength="100"></path>
            <path class="metric-gauge__progress" d="M 27.47 92.53 A 46 46 0 1 1 92.53 92.53" pathLength="100"></path>
          </svg>
          <p class="metric-value metric-value--battery">
            <span class="metric-primary"><span id="battery-value">Sin dato</span> <span class="metric-unit">%</span></span>
            <span id="battery-power" class="metric-secondary">Sin dato</span>
            <span id="battery-current" class="metric-secondary">Sin dato</span>
          </p>
        </div>
      </article>
      <article class="metric-card metric-card--load" data-metric="load">
        <h2>UPS / Casa</h2><p class="metric-status" id="load-status">Esperando datos</p>
        <div class="metric-gauge" data-gauge="load" role="img" aria-label="UPS / Casa: Sin dato">
          <svg class="metric-gauge__svg" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
            <path class="metric-gauge__track" d="M 27.47 92.53 A 46 46 0 1 1 92.53 92.53" pathLength="100"></path>
            <path class="metric-gauge__progress" d="M 27.47 92.53 A 46 46 0 1 1 92.53 92.53" pathLength="100"></path>
          </svg>
          <p class="metric-value"><span id="load-value">Sin dato</span> <span class="metric-unit">W</span><span id="load-current" class="metric-current">Sin dato</span></p>
        </div>
      </article>
      </section>
    </div>
    <section class="history" aria-labelledby="history-title">
      <div class="section-heading"><h2 id="history-title">Últimas 24 horas</h2></div>
      <p id="history-status" aria-live="polite">Cargando historial…</p>
      <div id="power-chart" class="chart" aria-label="Generación, consumo de Grid, carga de batería y consumo total de las últimas 24 horas"></div>
    </section>
  </main>
  <script src="/static/uPlot.iife.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
