<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deye Monitor</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><h1>Deye Monitor</h1><p id="connection">Conectando…</p><p id="age">Sin datos</p></header>
<main>
<section class="energy-flow" aria-labelledby="flow-title"><div class="section-heading"><h2 id="flow-title">Flujo energético</h2><p id="flow-status" aria-live="polite">Esperando datos de potencia…</p></div>
<svg id="energy-diagram" viewBox="0 0 1000 590" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">Diagrama de flujo energético Deye</title><desc id="diagram-description">PV arriba a la izquierda, Grid arriba a la derecha, Batería abajo a la izquierda, UPS y Load abajo a la derecha, e inversor en el centro.</desc><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<path id="flow-pv" class="flow-line" d="M 295 150 L 425 245"/><path id="flow-grid" class="flow-line" d="M 705 150 L 575 245"/><path id="flow-battery" class="flow-line" d="M 295 450 L 425 345"/><path id="flow-load" class="flow-line" d="M 575 345 L 705 450"/>
<text id="flow-pv-label" class="flow-label" x="330" y="180">—</text><text id="flow-grid-label" class="flow-label" x="670" y="180" text-anchor="end">—</text><text id="flow-battery-label" class="flow-label" x="330" y="420">—</text><text id="flow-load-label" class="flow-label" x="670" y="420" text-anchor="end">—</text>
<g class="energy-node pv-node" transform="translate(70 75)"><rect width="225" height="105" rx="16"/><text class="node-icon" x="112" y="43">☀</text><text class="node-name" x="112" y="76">PV</text><text id="pv-value" class="node-value" x="112" y="96">Sin dato</text></g><g class="energy-node grid-node" transform="translate(705 75)"><rect width="225" height="105" rx="16"/><text class="node-icon" x="112" y="43">⌁</text><text class="node-name" x="112" y="76">Grid</text><text id="grid-value" class="node-value" x="112" y="96">Sin dato</text></g><g class="energy-node inverter-node" transform="translate(400 235)"><rect width="200" height="120" rx="18"/><text class="node-icon" x="100" y="45">▣</text><text class="node-name" x="100" y="78">Inversor</text><text id="inverter-value" class="node-value" x="100" y="101">Deye</text></g><g class="energy-node battery-node" transform="translate(70 420)"><rect width="225" height="105" rx="16"/><text class="node-icon" x="112" y="43">▰</text><text class="node-name" x="112" y="76">Batería</text><text id="battery-value" class="node-value" x="112" y="96">Sin dato</text></g><g class="energy-node load-node" transform="translate(705 420)"><rect width="225" height="105" rx="16"/><text class="node-icon" x="112" y="43">⌂</text><text class="node-name" x="112" y="76">UPS + Load</text><text id="load-value" class="node-value" x="112" y="96">Sin dato</text></g></svg></section>
<section class="cards" aria-label="Detalle de métricas"><article><h2>Solar</h2><dl><dt>PV1</dt><dd data-path="solar.pv1_power_w" data-unit="W"></dd><dt>PV2</dt><dd data-path="solar.pv2_power_w" data-unit="W"></dd><dt>Total</dt><dd data-path="solar.total_power_w" data-unit="W"></dd></dl></article><article><h2>Batería</h2><dl><dt>SOC</dt><dd data-path="battery.soc_pct" data-unit="%"></dd><dt>Potencia</dt><dd data-path="battery.power_w" data-unit="W"></dd></dl></article><article><h2>Grid</h2><dl><dt>Tensión</dt><dd data-path="grid.voltage_v" data-unit="V"></dd><dt>Potencia</dt><dd data-path="grid.power_w" data-unit="W"></dd><dt>Comprada hoy</dt><dd data-path="grid.energy_bought_today_kwh" data-unit="kWh"></dd><dt>Vendida hoy</dt><dd data-path="grid.energy_sold_today_kwh" data-unit="kWh"></dd></dl></article><article><h2>UPS + Load</h2><dl><dt>Potencia</dt><dd data-path="load.total_power_w" data-unit="W"></dd></dl></article></section>
</main><script src="/static/app.js"></script></body></html>
